<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Alpona Mehendi Length Guide</title>
<desc id="desc">A hand and arm diagram showing Palm or Wrist, Bangle, Elbow, and Above Elbow or Full Arm mehendi coverage.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fffaf0"/>
    <stop offset="1" stop-color="#f3e6d3"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#b48a64" opacity=".15"/>
  </pattern>
</defs>
<rect width="1200" height="760" rx="28" fill="url(#bg)"/>
<rect x="14" y="14" width="1172" height="732" rx="22" fill="url(#dots)" stroke="#b08b62" stroke-width="2"/>
<g fill="#6f1f19">
  <text x="70" y="92" font-family="Georgia,serif" font-size="54" font-weight="600">Mehendi Length Guide</text>
  <text x="73" y="132" font-family="Arial,sans-serif" font-size="18" letter-spacing="4">CHOOSE YOUR PREFERRED COVERAGE</text>
</g>
<g font-family="Georgia,serif" fill="#2f271f">
  <text x="76" y="230" font-size="30" font-weight="600">Palm / Wrist Length</text>
  <text x="76" y="270" font-size="20">Design on the palm and up to the wrist.</text>
  <line x1="76" y1="298" x2="510" y2="298" stroke="#c1a17e"/>
  <text x="76" y="370" font-size="30" font-weight="600">Bangle Length</text>
  <text x="76" y="410" font-size="20">Extends above the wrist to the bangle area.</text>
  <line x1="76" y1="438" x2="510" y2="438" stroke="#c1a17e"/>
  <text x="76" y="510" font-size="30" font-weight="600">Elbow Length</text>
  <text x="76" y="550" font-size="20">Mehendi design continues up to the elbow.</text>
  <line x1="76" y1="578" x2="510" y2="578" stroke="#c1a17e"/>
  <text x="76" y="650" font-size="30" font-weight="600">Above Elbow / Full Arm</text>
  <text x="76" y="690" font-size="20">Long bridal coverage extending above the elbow.</text>
</g>
