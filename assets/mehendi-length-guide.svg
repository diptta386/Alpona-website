<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Alpona Mehendi Length Guide</title>
  <desc id="desc">Reference guide for Palm or Wrist, Bangle, Elbow, and Above Elbow or Full Arm Mehendi coverage.</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f3e5cd"/>
    </linearGradient>
    <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#9a744b" opacity=".10"/>
      <circle cx="17" cy="12" r=".8" fill="#9a744b" opacity=".08"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#paper)"/>
  <rect x="14" y="14" width="1572" height="872" rx="24" fill="url(#grain)" stroke="#a87b42" stroke-width="3"/>
  <path d="M32 54 H520 M1080 54 H1568" stroke="#a87b42" stroke-width="2"/>
  <path d="M32 846 H520 M1080 846 H1568" stroke="#a87b42" stroke-width="2"/>

  <g transform="translate(80 56)">
    <text x="0" y="52" font-family="Georgia,serif" font-size="54" font-style="italic" fill="#7b1616">Alpona’s</text>
    <text x="12" y="88" font-family="Arial,sans-serif" font-size="21" letter-spacing="9" fill="#5e3827">MEHENDI</text>
  </g>

  <text x="150" y="225" font-family="Georgia,serif" font-size="64" font-weight="700" fill="#27301d">Mehendi Length Guide</text>
  <text x="154" y="273" font-family="Arial,sans-serif" font-size="22" letter-spacing="7" fill="#443d30">CHOOSE THE COVERAGE THAT SUITS YOUR STYLE</text>

  <g transform="translate(150 342)" font-family="Georgia,serif" fill="#31291f">
    <rect x="-18" y="-22" width="735" height="430" rx="18" fill="#fffaf1" fill-opacity=".72" stroke="#b98a4e" stroke-width="2"/>

    <g transform="translate(18 24)">
      <text x="0" y="0" font-size="33" font-weight="700">Palm / Wrist Length</text>
      <text x="28" y="39" font-size="22">Beautiful designs for the palm and up to the wrist.</text>
      <line x1="0" y1="70" x2="650" y2="70" stroke="#c79c66"/>
    </g>

    <g transform="translate(18 124)">
      <text x="0" y="0" font-size="33" font-weight="700">Bangle Length</text>
      <text x="28" y="39" font-size="22">Extends from the palm to the bangle area.</text>
      <line x1="0" y1="70" x2="650" y2="70" stroke="#c79c66"/>
    </g>

    <g transform="translate(18 224)">
      <text x="0" y="0" font-size="33" font-weight="700">Elbow Length</text>
      <text x="28" y="39" font-size="22">Elegant designs from the palm up to the elbow.</text>
      <line x1="0" y1="70" x2="650" y2="70" stroke="#c79c66"/>
    </g>

    <g transform="translate(18 324)">
      <text x="0" y="0" font-size="33" font-weight="700">Above Elbow / Full Arm</text>
      <text x="28" y="39" font-size="22">Intricate bridal coverage extending above the elbow.</text>
    </g>
  </g>

